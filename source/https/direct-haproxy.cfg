global
    maxconn 128
    nbthread 2

defaults
    mode tcp
    timeout connect 5s
    timeout client 1h
    timeout server 1h

frontend vohive_tls_router
    bind 0.0.0.0:8443
    tcp-request inspect-delay 3s
    tcp-request content accept if { req.ssl_hello_type 1 }
    use_backend vohive_tls if { req.ssl_sni -i xjp.721609.xyz }
    default_backend router_admin_tls

backend router_admin_tls
    server luci 127.0.0.1:443

backend vohive_tls
    server local_tls 127.0.0.1:8444

frontend vohive_https
    mode http
    bind 127.0.0.1:8444 ssl crt /etc/vohive-https/direct.pem alpn h2,http/1.1
    compression algo gzip
    compression type text/html text/css text/javascript application/javascript application/json image/svg+xml
    compression offload
    http-request set-header X-Forwarded-Proto https
    http-response set-header X-VoHive-Route direct
    use_backend telegram_public if { path_beg /bot /file/bot }
    default_backend vohive_local

backend vohive_local
    mode http
    server vohive 127.0.0.1:7575

backend telegram_public
    mode http
    server vps 129.150.57.185:443 ssl verify required ca-file /etc/ssl/certs/ca-certificates.crt verifyhost xjp.721609.xyz sni str(xjp.721609.xyz)
