server {
    server_name xjp.721609.xyz;

    location ~ ^/(bot[0-9]+:|file/bot[0-9]+:) {
        # Resolve the upstream at request time so DNS outages do not stop nginx.
        resolver 127.0.0.53 valid=60s ipv6=off;
        resolver_timeout 5s;
        set $telegram_api_host api.telegram.org;
        proxy_pass https://$telegram_api_host$request_uri;
        proxy_ssl_name $telegram_api_host;
        proxy_ssl_server_name on;
        proxy_set_header Host api.telegram.org;
    }

    location / {
        gzip on;
        gzip_comp_level 3;
        gzip_min_length 1024;
        gzip_vary on;
        gzip_proxied any;
        gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
        add_header X-VoHive-Route public always;
        proxy_pass http://127.0.0.1:17575;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $vohive_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/xjp.721609.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/xjp.721609.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = xjp.721609.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name xjp.721609.xyz;
    return 404; # managed by Certbot


}